services:
  db:
    image: postgres:17-alpine
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5423:5432"
    volumes:
      - ecommerce-db-data:/var/lib/postgresql/data

volumes:
  ecommerce-db-data: